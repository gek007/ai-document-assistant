[project]
name = "ai-document-assistant"
version = "0.1.0"
description = "AI-powered document agent — ask natural language questions about a collection of documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30",
    "gradio>=4.40",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "aiofiles>=23.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
